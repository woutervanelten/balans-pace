esphome:
  name: "pace_bms"
  friendly_name: pace_bms
  min_version: 2026.4.0
  name_add_mac_suffix: false

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

# Enable logging
logger:
  level: INFO
  baud_rate: 0
  tx_buffer_size: 512
  
# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: false
  reboot_timeout: 15min
  power_save_mode: none

web_server:
  port: 80
  version: 3
  include_internal: False
#  ota: False
  local: True

# Configure UART
uart:
  id: uart_0
  baud_rate: 9600
  tx_pin: GPIO17
  rx_pin: GPIO18
  debug:
    direction: BOTH
    dummy_receiver: false

external_components:
  - source:
      type: git
      url: https://github.com/woutervanelten/balans-pace
    components: [ pace_bms ]
    refresh: 1d

pace_bms:
  - id: master_bms
    address: 2
    uart_id: uart_0
    flow_control_pin: GPIO21
    update_interval: 10s
    request_throttle: 50ms
    response_timeout: 6000ms
    protocol_commandset: 0x25
    protocol_version: 0x20
    type: MASTER
    slave_query_mode: RELAY
    rx_buffer_size: 2048

  - id: slave_bms_3
    address: 3
    type: SLAVE
    master_bms_id: master_bms

  - id: slave_bms_4
    address: 4
    type: SLAVE
    master_bms_id: master_bms

  - id: slave_bms_5
    address: 5
    type: SLAVE
    master_bms_id: master_bms
    
